services:
  mempool-matrix:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    container_name: mempool-matrix
    restart: unless-stopped
    environment:
      MEMPOOL_API_URL: ${MEMPOOL_API_URL:-https://mempool.space/api}
      MEMPOOL_CONFIG_PATH: /data/runtime-config.json
      MEMPOOL_SETTINGS_TOKEN: ${MEMPOOL_SETTINGS_TOKEN:-}
      MEMPOOL_ALLOW_UNAUTHENTICATED_SETTINGS: ${MEMPOOL_ALLOW_UNAUTHENTICATED_SETTINGS:-false}
      MEMPOOL_TRUST_PROXY: ${MEMPOOL_TRUST_PROXY:-false}
      MEMPOOL_SOURCE_DENY_HOSTS: ${MEMPOOL_SOURCE_DENY_HOSTS:-}
      MEMPOOL_HISTORY_DIR: /data/mempool-history
      MEMPOOL_HISTORY_INTERVAL_MS: ${MEMPOOL_HISTORY_INTERVAL_MS:-60000}
      MEMPOOL_HISTORY_RETENTION_DAYS: ${MEMPOOL_HISTORY_RETENTION_DAYS:-30}
    ports:
      - "${PORT:-3033}:3000"
    volumes:
      - ./data:/data
    mem_limit: 512m
