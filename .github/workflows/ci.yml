name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pin the Node.js 20 baseline instead of floating on the major.
          node-version: 20.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:security
      - run: npm test
      - run: npm run lint
      - run: npm run build
