name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the manually built multi-architecture image to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mempool-matrix:ci-${{ matrix.arch }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            OCI_LICENSES=MIT
          cache-from: type=gha,scope=container-validate-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-validate-${{ matrix.arch }}

      - name: Run standalone container smoke test
        env:
          IMAGE: mempool-matrix:ci-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SMOKE_SKIP_BUILD: "1"
        run: ./scripts/smoke-container.sh

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mempool-matrix:ci-${{ matrix.arch }}
          format: table
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

  publish:
    name: Publish multi-architecture image
    needs: validate
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/miguelmedeiros/mempool-matrix
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a strict SemVer release tag
        if: github.event_name == 'push'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const ref = process.env.RELEASE_REF ?? "";
          const tag = ref.replace(/^refs\/tags\//, "");
          const identifier = String.raw`(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)`;
          const semver = new RegExp(`^v(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-${identifier}(?:\\.${identifier})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`);
          if (!ref.startsWith("refs/tags/") || !semver.test(tag)) {
            console.error(`Refusing to publish non-SemVer ref: ${ref}`);
            process.exit(1);
          }
          console.log(`Validated release tag: ${tag}`);
          NODE

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Mempool Matrix
            org.opencontainers.image.description=A live visualization and explorer for the Bitcoin mempool
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.meta.outputs.version }}
            OCI_LICENSES=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-publish
          cache-to: type=gha,mode=max,scope=container-publish

      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Published container"
            echo
            echo '```text'
            echo "$TAGS"
            echo "digest=$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
